### model
model_name_or_path: /data/SharedFile/Qwen/Qwen2___5-7B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 64
lora_dropout: 0.05
lora_target: all

### dataset
dataset: sft_data
template: qwen
cutoff_len: 4096
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: sft_data
logging_steps: 10
save_steps: 1362
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-6
num_train_epochs: 15
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
val_size: 0.1
per_device_eval_batch_size: 1
do_eval: false
eval_strategy: steps
eval_steps: 1362
report_to: none
mask_think: false

use_unsloth: true
use_unsloth_gc: true

